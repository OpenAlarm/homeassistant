arm:
  fields:
    device_id:
      required: true
      selector:
        device:
          multiple: true
          filter:
            - integration: openalarm
              model: Alarm
    mode:
      required: false
      example: away
      selector:
        select:
          mode: dropdown
          custom_value: true
          translation_key: mode
          options:
            - home
            - away
            - night

